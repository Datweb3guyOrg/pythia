name: Pythia trading run

# PRIMARY as of 2026-08-13 — `flyctl deploy` is stuck on a local sandbox
# networking issue (no IPv6 route, flyctl's Go resolver won't fall back to
# IPv4), so the Fly.io deployment (pythia-delphi-agent) is stuck on an old
# build and can't receive new estimators/config until that's fixed. GitHub
# Actions runs on separate infrastructure and isn't affected, so this is now
# the live path for actual updates.
#
# Fly's daemon is still running in parallel on its stale build. This is not
# a double-trade risk for any single market: the one-shot-per-market check
# in run.ts reads live positions straight from the chain, not local state,
# so both deployments independently see the same on-chain truth and neither
# re-buys a market the other already holds. The one real gap: category-spend
# caps are NOT coordinated between the two (Fly's persistent volume and this
# workflow's cache are separate state stores), so combined spend across a
# category could in principle exceed the intended cap if both fire into new
# markets in the same window. Low risk in practice since Fly's stale build
# has no signal on anything added after the last successful Fly deploy.
on:
  schedule:
    - cron: "*/5 * * * *" # matches daemon.ts's INTERVAL_MS
  workflow_dispatch: {} # manual trigger button in the Actions tab

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore category-spent state
        uses: actions/cache@v4
        with:
          path: state/
          key: pythia-state-${{ github.run_id }}
          restore-keys: |
            pythia-state-

      - run: npm ci

      - name: Run agent
        env:
          DELPHI_API_ACCESS_KEY: ${{ secrets.DELPHI_API_ACCESS_KEY }}
          DELPHI_SIGNER_TYPE: private_key
          WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
          DELPHI_NETWORK: competition-testnet
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: npm start

      # actions/cache's restore-keys pattern means the exact key (tied to
      # this run_id) never hits on restore, so save always runs and writes
      # a fresh entry — old entries age out under the shared cache quota
      - name: Save category-spent state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/
          key: pythia-state-${{ github.run_id }}
