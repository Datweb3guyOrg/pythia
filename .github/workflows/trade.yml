name: Pythia trading run

# BACKUP ONLY — Fly.io (pythia-delphi-agent, src/agent/daemon.ts) is the
# primary deployment and is currently live. The schedule trigger is
# deliberately OFF: this account can actually execute workflows (unlike the
# old billing-locked one), so an active schedule here would fire real trades
# every 5 minutes concurrently with Fly — both read/write category-spent
# state independently, with no shared coordination, so that would double up
# on category exposure caps and could double-trade. Only re-enable the
# schedule if Fly is deliberately stopped first. workflow_dispatch (manual
# trigger) stays available for one-off testing.
on:
  workflow_dispatch: {} # manual trigger button in the Actions tab

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore category-spent state
        uses: actions/cache@v4
        with:
          path: state/
          key: pythia-state-${{ github.run_id }}
          restore-keys: |
            pythia-state-

      - run: npm ci

      - name: Run agent
        env:
          DELPHI_API_ACCESS_KEY: ${{ secrets.DELPHI_API_ACCESS_KEY }}
          DELPHI_SIGNER_TYPE: private_key
          WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
          DELPHI_NETWORK: competition-testnet
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: npm start

      # actions/cache's restore-keys pattern means the exact key (tied to
      # this run_id) never hits on restore, so save always runs and writes
      # a fresh entry — old entries age out under the shared cache quota
      - name: Save category-spent state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/
          key: pythia-state-${{ github.run_id }}
