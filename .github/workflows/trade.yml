name: Pythia trading run

# BACKUP ONLY — Fly.io (pythia-delphi-agent, src/agent/daemon.ts) is the
# primary deployment. Do not enable this on a schedule at the same time as
# Fly is running: both read/write category-spent state independently, so
# running concurrently could double up on category exposure caps. This is
# left here for if the GitHub account billing lock clears and you want to
# switch back, or as a manual one-off via workflow_dispatch.
on:
  schedule:
    - cron: "*/10 * * * *" # kept in sync with daemon.ts's INTERVAL_MS
  workflow_dispatch: {} # manual trigger button in the Actions tab

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore category-spent state
        uses: actions/cache@v4
        with:
          path: state/
          key: pythia-state-${{ github.run_id }}
          restore-keys: |
            pythia-state-

      - run: npm ci

      - name: Run agent
        env:
          DELPHI_API_ACCESS_KEY: ${{ secrets.DELPHI_API_ACCESS_KEY }}
          DELPHI_SIGNER_TYPE: private_key
          WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
          DELPHI_NETWORK: competition-testnet
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: npm start

      # actions/cache's restore-keys pattern means the exact key (tied to
      # this run_id) never hits on restore, so save always runs and writes
      # a fresh entry — old entries age out under the shared cache quota
      - name: Save category-spent state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/
          key: pythia-state-${{ github.run_id }}
